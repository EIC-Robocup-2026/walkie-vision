[project]
name = "walkie-vision"
version = "0.1.0"
description = "Walkie's vision: object detection, pose, face recognition and person re-identification on ROS 2 (EIC RoboCup 2026)"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Runtime dependencies (ROS 2, PyTorch, ONNX Runtime, the model libraries) are
# declared in pixi.toml.
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS 2 ships pytest plugins (launch_testing, etc.) that are not needed here.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint"

# The package's import rules. tests/test_import_contracts.py checks them inside
# pytest through import-linter's Python API, together with two rules the
# contracts do not express: the layers name every top-level module exactly once,
# and the __init__.py rule.
# A module that moves or leaves the package is renamed or removed in every list
# here in the same commit: import-linter fails on a module that does not exist.
# Whether a module loads a model library when imported is not a contract,
# because grimp also counts imports inside functions; tests/test_import_light.py
# checks it at run time.
[tool.importlinter]
root_package = "walkie_vision"
include_external_packages = true

# The model code runs without ROS: checks, tools and tests load the models in
# a plain Python process, and the node is the one place that turns their
# output into messages.
[[tool.importlinter.contracts]]
id = "model-code-knows-no-ros"
name = "Model code imports no ROS package"
type = "forbidden"
source_modules = [
    "walkie_vision._vendor",
    "walkie_vision.boxes",
    "walkie_vision.crops",
    "walkie_vision.errors",
    "walkie_vision.fakes",
    "walkie_vision.providers",
    "walkie_vision.weights",
]
forbidden_modules = [
    "rclpy",
    "sensor_msgs",
    "std_msgs",
    "builtin_interfaces",
    "geometry_msgs",
    "rcl_interfaces",
    "tf2_msgs",
    "visualization_msgs",
    "vision_msgs",
    "walkie_vision_msgs",
]

# A provider wraps one model and returns plain Python values; the node, the
# pipeline and the services turn those into messages. So the providers and the
# vendored code they wrap import no ROS package and none of the modules that
# sit above them or run the node, and a provider can be loaded and tested
# without the node, a camera or a message.
[[tool.importlinter.contracts]]
id = "providers-know-no-ros-or-the-node"
name = "Providers and vendored code import neither ROS nor the node's modules"
type = "forbidden"
source_modules = [
    "walkie_vision._vendor",
    "walkie_vision.providers",
]
forbidden_modules = [
    "rclpy",
    "sensor_msgs",
    "std_msgs",
    "builtin_interfaces",
    "geometry_msgs",
    "rcl_interfaces",
    "tf2_msgs",
    "visualization_msgs",
    "vision_msgs",
    "walkie_vision_msgs",
    "walkie_vision.camera",
    "walkie_vision.config",
    "walkie_vision.crops",
    "walkie_vision.debug_viz",
    "walkie_vision.fake_publisher",
    "walkie_vision.fakes",
    "walkie_vision.geometry",
    "walkie_vision.loading",
    "walkie_vision.messages",
    "walkie_vision.node",
    "walkie_vision.pipeline",
    "walkie_vision.services",
]

# The InsightFace files in _vendor/insightface/ (SCRFD, ArcFace, the alignment)
# are vendored. Only the face wrapper, providers/face_recognition/buffalo_l.py,
# uses them, so a change to the vendored code touches one caller. The package
# is protected as a whole, so arcface may import face_align inside it.
[[tool.importlinter.contracts]]
id = "insightface-wrapped-once"
name = "The vendored InsightFace files are imported only by the face wrapper"
type = "protected"
as_packages = true
protected_modules = ["walkie_vision._vendor.insightface"]
allowed_importers = ["walkie_vision.providers.face_recognition.buffalo_l"]

# The OSNet network from torchreid, in _vendor/torchreid/, is vendored. Only
# the reid provider, providers/reid/osnet.py, uses it, so a change to the
# vendored code touches one caller. With as_packages = false, the package and
# its one module are listed one by one.
[[tool.importlinter.contracts]]
id = "torchreid-wrapped-once"
name = "The vendored torchreid file is imported only by the reid provider"
type = "protected"
as_packages = false
protected_modules = [
    "walkie_vision._vendor.torchreid",
    "walkie_vision._vendor.torchreid.osnet",
]
allowed_importers = ["walkie_vision.providers.reid.osnet"]

# Vendored code stays as its upstream wrote it, so it can be compared with
# and updated from upstream: it imports nothing else from walkie_vision.
[[tool.importlinter.contracts]]
id = "vendored-code-stands-alone"
name = "Vendored code imports nothing else from walkie_vision"
type = "forbidden"
source_modules = ["walkie_vision._vendor"]
forbidden_modules = [
    "walkie_vision.boxes",
    "walkie_vision.camera",
    "walkie_vision.config",
    "walkie_vision.crops",
    "walkie_vision.debug_viz",
    "walkie_vision.errors",
    "walkie_vision.fake_publisher",
    "walkie_vision.fakes",
    "walkie_vision.geometry",
    "walkie_vision.loading",
    "walkie_vision.messages",
    "walkie_vision.node",
    "walkie_vision.pipeline",
    "walkie_vision.providers",
    "walkie_vision.services",
    "walkie_vision.weights",
]

# The top-level modules form layers, listed top first, and an import may only
# point to a lower layer: the vision node and the debug viewer at the top;
# then loading, which builds the providers, and the fake publisher, the stand-in
# for the object stream; then the pipeline, the bounded services and the fake
# providers; then the camera input, the crops, the depth geometry, the node's
# config and the messages; then the providers, which wrap the models; and at
# the bottom the box maths, the model file table and the exception classes,
# which every other module may import. The modules of a layer written with "|"
# import none of each other. The middle layer uses ":" instead, because its
# modules share small pieces: geometry takes RegisteredDepth from camera/ and
# the cloud point limits from messages, camera/'s mailboxes read message stamps
# with messages.stamp_ns, and messages checks colour shares against crops/'s
# COLOR_NAMES. The vendored code is outside the layers; the two protected
# contracts above say which provider may import it. exhaustive = true makes
# every top-level module part of a layer, so adding one is a two-file change:
# the new module and its place in this list.
[[tool.importlinter.contracts]]
id = "layers-point-down"
name = "The vision layers point down"
type = "layers"
containers = ["walkie_vision"]
exhaustive = true
exhaustive_ignores = ["_vendor"]
layers = [
    "node | debug_viz",
    "loading | fake_publisher",
    "pipeline | services | fakes",
    "messages : camera : crops : geometry : config",
    "providers",
    "boxes | weights | errors",
]

# walkie_vision.providers re-exports the names of its modules for callers
# outside it. A module inside providers/ imports the module that defines a
# name, never the package: importing the package runs its __init__, which
# imports the module back before it has finished loading.
[[tool.importlinter.contracts]]
id = "providers-modules-skip-the-package-init"
name = "Modules inside providers/ do not import the providers package itself"
type = "forbidden"
as_packages = false
source_modules = ["walkie_vision.providers.**"]
forbidden_modules = ["walkie_vision.providers"]

# Two modules of one package never import each other, directly or through
# others: a cycle means neither can be understood or moved alone.
[[tool.importlinter.contracts]]
id = "no-sibling-cycles"
name = "No import cycles between sibling modules"
type = "acyclic_siblings"
ancestors = ["walkie_vision"]
